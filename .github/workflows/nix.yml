name: Nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write # cache-nix-action purges the caches it replaces

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: blacksmith-12vcpu-macos-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          # The derivations compile with the runner's Xcode (see nix/xcode.nix).
          extra_nix_config: |
            sandbox = relaxed

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock', 'ci/stikjit-high-address.patch') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-macos: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never
          save: ${{ github.event_name != 'pull_request' }}

      - name: Build dependencies
        run: nix build -L --no-link .#iosLibs .#rppairing .#stikjitFramework

      - name: Build Henge.ipa
        run: nix build -L -o result-ipa .#ipa

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Henge-${{ github.sha }}
          path: result-ipa/Henge.ipa
          if-no-files-found: error
